<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Clean studio background -->
  <rect width="200" height="200" fill="#FFFFFF"/>
  <rect x="20" y="20" width="160" height="160" rx="24" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="1.5"/>
  
  <!-- Soft drop shadow -->
  <ellipse cx="100" cy="148" rx="42" ry="7" fill="#000000" fill-opacity="0.06"/>
  <ellipse cx="100" cy="148" rx="28" ry="4" fill="#000000" fill-opacity="0.08"/>

  <!-- Specialty Coffee Cup Silhouette -->
  <!-- Saucer -->
  <ellipse cx="100" cy="136" rx="46" ry="8" fill="#E5E7EB"/>
  <ellipse cx="100" cy="135" rx="44" ry="7" fill="#F3F4F6"/>
  <ellipse cx="100" cy="134" rx="30" ry="4" fill="#E5E7EB"/>

  <!-- Cup body -->
  <path d="M68 96 C68 128 80 134 100 134 C120 134 132 128 132 96 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  
  <!-- Cup Handle -->
  <path d="M130 102 C144 102 144 122 130 122" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>

  <!-- Cup interior & Crema -->
  <ellipse cx="100" cy="96" rx="32" ry="9" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="2"/>
  <ellipse cx="100" cy="96" rx="28" ry="7" fill="#B45309"/>
  <ellipse cx="100" cy="96" rx="22" ry="5" fill="#D97706"/>
  <ellipse cx="102" cy="95.5" rx="14" ry="3" fill="#FDE68A"/>

  <!-- Steam curves -->
  <path d="M92 84 C88 76 96 72 92 64" stroke="#9CA3AF" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="1 2"/>
  <path d="M100 82 C96 74 104 70 100 62" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <path d="M108 84 C104 76 112 72 108 64" stroke="#9CA3AF" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="1 2"/>

  <!-- Subtle brand text -->
  <text x="100" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#9CA3AF" letter-spacing="1.5">KAFEINA</text>
</svg>
